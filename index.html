<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Rain Web</title>
<style>
  :root {
    --bg: #111318;
    --panel: #1a1d24;
    --bubble: #232733;
    --text: #e8eaef;
    --muted: #8b93a7;
    --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    flex: 0 0 auto;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid #2a2f3a;
    font-weight: 600;
  }
  #stream {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .me { align-self: flex-end; background: var(--accent); color: #fff; }
  .ai { align-self: flex-start; background: var(--bubble); }
  footer {
    flex: 0 0 auto;
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 12px;
    background: var(--panel);
    border-top: 1px solid #2a2f3a;
  }
  #input {
    flex: 1 1 auto;
    resize: none;
    max-height: 140px;
    min-height: 40px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid #2f3542;
    background: #14171d;
    color: var(--text);
    font-size: 16px;
    line-height: 1.4;
    outline: none;
  }
  #send {
    flex: 0 0 auto;
    height: 40px; padding: 0 18px;
    border: none; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 600;
  }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<header>Rain Web</header>
<div id="stream"></div>
<footer>
  <textarea id="input" rows="1" placeholder="说点什么..."></textarea>
  <button id="send">发送</button>
</footer>
<script>
  var stream = document.getElementById("stream");
  var input = document.getElementById("input");
  var send = document.getElementById("send");

  function addMsg(text, cls) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    stream.appendChild(d);
    stream.scrollTop = stream.scrollHeight;
    return d;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }
  input.addEventListener("input", autoGrow);

  function post(text) {
    return fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    }).then(function (r) { return r.json(); });
  }

  function submit() {
    var text = input.value.trim();
    if (!text) return;
    addMsg(text, "me");
    input.value = "";
    autoGrow();
    send.disabled = true;
    post(text).then(function (data) {
      addMsg(data.reply || data.error || "(no reply)", "ai");
    }).catch(function (e) {
      addMsg("请求失败: " + e.message, "ai");
    }).then(function () {
      send.disabled = false;
      input.focus();
    });
  }

  send.addEventListener("click", submit);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });
</script>
</body>
</html>
